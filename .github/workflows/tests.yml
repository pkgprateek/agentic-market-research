name: Tests & Linting

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install uv
      run: pip install uv
    
    - name: Install dependencies
      run: make install
    
    - name: Lint
      run: make lint
      continue-on-error: true
    
    - name: Type check
      run: make typecheck
      continue-on-error: true
    
    - name: Run tests
      run: make test
